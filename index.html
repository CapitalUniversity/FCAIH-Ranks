<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAIH</title>
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <link rel="icon" type="image/png" href="CapitalUniversity.png">

    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState } = React;

        // CONFIGURATION - Update these Google Drive file IDs
        // To get the file ID: Share the file → Get link → Extract the ID from the URL
        // URL format: https://drive.google.com/file/d/FILE_ID_HERE/view?usp=sharing
        const DRIVE_CONFIG = {
            2022: '1vD9K0jkjaBQWiowAhgZMQT7BKQKd_vpb',  // https://drive.google.com/file/d/1vD9K0jkjaBQWiowAhgZMQT7BKQKd_vpb/view?usp=sharing
            2023: '1OsK89EplPkHKfYze0BA8BmWcHPz0pLwR',  // https://drive.google.com/file/d/1OsK89EplPkHKfYze0BA8BmWcHPz0pLwR/view?usp=sharing
            2024: '1kGiOTU4eg8U1xNZbIS8bOwXn0VR3nAut',  // https://drive.google.com/file/d/1kGiOTU4eg8U1xNZbIS8bOwXn0VR3nAut/view?usp=sharing
            2025: '1BOtlCpMnhzmKvwoy6Psi3GTsyrfW4TBE',  // https://drive.google.com/file/d/1BOtlCpMnhzmKvwoy6Psi3GTsyrfW4TBE/view?usp=sharing
        };

        // Icon components using lucide
        const SearchIcon = () => <i data-lucide="search" className="w-5 h-5"></i>;
        const AwardIcon = () => <i data-lucide="award" className="w-5 h-5"></i>;
        const BookOpenIcon = () => <i data-lucide="book-open" className="w-5 h-5"></i>;
        const AlertCircleIcon = () => <i data-lucide="alert-circle" className="w-5 h-5"></i>;
        const Loader2Icon = () => <i data-lucide="loader-2" className="w-5 h-5 animate-spin"></i>;

        function StudentRankLookup() {
            const [studentId, setStudentId] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);

            // Initialize lucide icons after render
            React.useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [result, error, loading]);

            const getYear = (id) => {
                if (!id || id.length < 4) return null;
                return id.substring(0, 4);
            };

            const fetchStudentData = async (id) => {
                const year = getYear(id);
                if (!year || !DRIVE_CONFIG[year]) {
                    setError(`Invalid student ID or year ${year} not configured`);
                    return;
                }

                setLoading(true);
                setError(null);
                setResult(null);

                try {
                    // 1. Use the Export URL format for better compatibility
                    const fileId = DRIVE_CONFIG[year];
                    const csvUrl = `https://docs.google.com/spreadsheets/d/${fileId}/export?format=csv`;
                    
                    // Note: For Google Drive files (not Sheets), use: 
                    // const csvUrl = `https://drive.google.com/uc?export=download&id=${fileId}`;

                    const response = await fetch(csvUrl);
                    if (!response.ok) throw new Error('Could not reach the data source');
                    
                    const csvText = await response.text();
                    
                    // 2. Simple CSV Parser
                    const rows = csvText.split('\n').map(row => row.split(','));
                    const headers = rows[0].map(h => h.trim().toLowerCase());
                    
                    // Find the index of the columns
                    const idIdx = headers.indexOf('id');
                    const specIdx = headers.indexOf('specialization');
                    const gpaIdx = headers.indexOf('gpa');
                    const hoursIdx = headers.indexOf('credit_hours');
                    const rankIdx = headers.indexOf('rank');

                    // 3. Search for the student
                    const studentRow = rows.find(row => row[idIdx]?.trim() === id);

                    if (!studentRow) {
                        setError(`Student ID ${id} not found in ${year} records`);
                        return;
                    }

                    // 4. Map data to result
                    setResult({
                        id: studentRow[idIdx],
                        specialization: studentRow[specIdx],
                        gpa: studentRow[gpaIdx],
                        credit_hours: studentRow[hoursIdx],
                        rank: studentRow[rankIdx],
                        year: year
                    });

                } catch (err) {
                    console.error('Error:', err);
                    setError("Access Denied: Ensure the Google Drive file is shared as 'Anyone with the link can view'.");
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const trimmedId = studentId.trim();
                
                if (!trimmedId) {
                    setError('Please enter a student ID');
                    return;
                }

                if (!/^\d{8}$/.test(trimmedId)) {
                    setError('Student ID must be 8 digits');
                    return;
                }

                fetchStudentData(trimmedId);
            };

            const getRankColor = (rank) => {
                if (rank === 'N/A' || !rank) return 'text-gray-500';
                const numRank = parseInt(rank);
                if (numRank === 1) return 'text-yellow-500';
                if (numRank <= 10) return 'text-blue-500';
                if (numRank <= 50) return 'text-green-500';
                return 'text-gray-600';
            };

            const getRankBadge = (rank) => {
                if (rank === 'N/A' || !rank) return null;
                const numRank = parseInt(rank);
                if (numRank === 1) return '🥇 Top Student!';
                if (numRank <= 10) return '🏆 Top 10';
                if (numRank <= 50) return '⭐ Top 50';
                return null;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6">
                    <div className="max-w-2xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center mb-4">
                                <i data-lucide="award" className="w-12 h-12 text-indigo-600"></i>
                            </div>
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">
                                Student Rank Lookup
                            </h1>
                            <p className="text-gray-600">
                                Enter your student ID to view your rank with 90% Accuracy
                            </p>
                        </div>

                        {/* Search Form */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label htmlFor="studentId" className="block text-sm font-medium text-gray-700 mb-2">
                                        Student ID
                                    </label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            id="studentId"
                                            value={studentId}
                                            onChange={(e) => setStudentId(e.target.value)}
                                            placeholder="e.g., 20250001"
                                            maxLength={8}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
                                        />
                                        <i data-lucide="search" className="absolute right-3 top-3.5 w-5 h-5 text-gray-400"></i>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-1">
                                        Enter your 8-digit student ID (e.g., 2022XXXX, 2023XXXX, etc.)
                                    </p>
                                </div>

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center"
                                >
                                    {loading ? (
                                        <>
                                            <i data-lucide="loader-2" className="w-5 h-5 mr-2 animate-spin"></i>
                                            Searching...
                                        </>
                                    ) : (
                                        <>
                                            <i data-lucide="search" className="w-5 h-5 mr-2"></i>
                                            Search
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>

                        {/* Error Message */}
                        {error && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 flex items-start">
                                <i data-lucide="alert-circle" className="w-5 h-5 text-red-500 mt-0.5 mr-3 flex-shrink-0"></i>
                                <div>
                                    <h3 className="font-semibold text-red-800">Error</h3>
                                    <p className="text-red-700 text-sm">{error}</p>
                                </div>
                            </div>
                        )}

                        {/* Results */}
                        {result && (
                            <div className="bg-white rounded-lg shadow-lg p-6 space-y-6">
                                {/* Header */}
                                <div className="border-b pb-4">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h2 className="text-2xl font-bold text-gray-800">
                                                ID: {result.id}
                                            </h2>
                                            <p className="text-sm text-gray-600">Year: {result.year}</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-medium">
                                                {result.specialization || 'General'}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* Stats Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-3 gap-4">
                                    {/* Rank */}
                                    <div className="bg-gradient-to-br from-yellow-50 to-yellow-100 rounded-lg p-4">
                                        <div className="flex items-center mb-2">
                                            <i data-lucide="award" className="w-5 h-5 text-yellow-600 mr-2"></i>
                                            <span className="text-sm font-medium text-gray-700">Rank</span>
                                        </div>
                                        <div className={`text-3xl font-bold ${getRankColor(result.rank)}`}>
                                            {result.rank === 'N/A' ? 'N/A' : `#${result.rank}`}
                                        </div>
                                        {getRankBadge(result.rank) && (
                                            <div className="mt-2 text-xs font-medium text-yellow-700">
                                                {getRankBadge(result.rank)}
                                            </div>
                                        )}
                                    </div>

                                    {/* GPA */}
                                    {/*<div className="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-4">
                                        <div className="flex items-center mb-2">
                                            <i data-lucide="book-open" className="w-5 h-5 text-blue-600 mr-2"></i>
                                            <span className="text-sm font-medium text-gray-700">GPA</span>
                                        </div>
                                        <div className="text-3xl font-bold text-blue-600">
                                            {result.gpa || 'N/A'}
                                        </div>
                                        <div className="mt-2 text-xs text-blue-700">
                                            {result.gpa && parseFloat(result.gpa) >= 3.5 ? 'Excellent' :
                                                result.gpa && parseFloat(result.gpa) >= 3.0 ? 'Very Good' :
                                                result.gpa && parseFloat(result.gpa) >= 2.5 ? 'Good' :
                                                result.gpa && parseFloat(result.gpa) >= 2.0 ? 'Pass' : 'Needs Improvement'}
                                        </div>
                                    </div>*/}

                                    {/* Credit Hours */}
                                    <div className="bg-gradient-to-br from-green-50 to-green-100 rounded-lg p-4">
                                        <div className="flex items-center mb-2">
                                            <i data-lucide="book-open" className="w-5 h-5 text-green-600 mr-2"></i>
                                            <span className="text-sm font-medium text-gray-700">Credit Hours</span>
                                        </div>
                                        <div className="text-3xl font-bold text-green-600">
                                            {result.credit_hours || 'N/A'}
                                        </div>
                                        <div className="mt-2 text-xs text-green-700">
                                            Completed
                                        </div>
                                    </div>
                                </div>

                                {/* Error Info */}
                                {result.error && (
                                    <div className="bg-orange-50 border border-orange-200 rounded-lg p-3">
                                        <p className="text-sm text-orange-700">
                                            <strong>Note:</strong> {result.error}
                                        </p>
                                    </div>
                                )}

                                {/* Success Message */}
                                {!result.error && (
                                    <div className="bg-green-50 border border-green-200 rounded-lg p-3">
                                        <p className="text-sm text-green-700 text-center">
                                            ✓ Your academic record has been successfully retrieved
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Footer */}
                        <div className="mt-8 text-center text-sm text-gray-600">
                            <p>Faculty of Computers and Artificial Intelligence</p>
                            <p className="mt-1">Student Academic Records System</p>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentRankLookup />);
    </script>
</body>
</html>
