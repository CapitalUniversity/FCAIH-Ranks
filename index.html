<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAIH</title>

    <!-- Favicon -->
    <link rel="icon" type="image/png" href="CapitalUniversity.png">
    <link rel="shortcut icon" type="image/png" href="CapitalUniversity.png">
    <link rel="apple-touch-icon" href="CapitalUniversity.png">
    
    <!-- Tailwind CSS -->
    <script src="https://cdn.tailwindcss.com"></script>
    
    <!-- React and ReactDOM -->
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <!-- Babel Standalone for JSX -->
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <!-- Lucide Icons -->
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        // CONFIGURATION - Your Google Apps Script Web App URL
        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLgXuvPOS_r82N9M8FqZ1TkoZ8Pl9p7E5MxKwRT876ltNvs2sx_2uiTH3getkoB3i-/exec';

        function StudentRankLookup() {
            const [studentId, setStudentId] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [rateLimitInfo, setRateLimitInfo] = useState(null);

            // Initialize lucide icons after render
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [result, error, loading, rateLimitInfo]);

            // ... existing state variables ...

            // 1. ADD THIS HELPER FUNCTION inside the component or outside
            const getBrowserFingerprint = () => {
                let token = localStorage.getItem('fcaih_user_token');
                if (!token) {
                    // Generate a random unique ID for this browser
                    token = 'user_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                    localStorage.setItem('fcaih_user_token', token);
                }
                return token;
            };

            const fetchStudentData = async (id) => {
                setLoading(true);
                setError(null);
                setResult(null);
                setRateLimitInfo(null);

                try {
                    // 2. GET THE TOKEN
                    const userToken = getBrowserFingerprint();

                    // 3. SEND THE TOKEN TO GOOGLE APPS SCRIPT
                    // Notice we added &userToken=${userToken} to the URL
                    const response = await fetch(`${APPS_SCRIPT_URL}?id=${encodeURIComponent(id)}&userToken=${userToken}`);
                    
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }
            // ... rest of your code remains exactly the same ...

                    const data = await response.json();

                    if (data.status === 'error') {
                        // Check if it's a rate limit error
                        if (data.message && data.message.includes('Too many requests')) {
                            setRateLimitInfo(data.message);
                        }
                        setError(data.message || 'An error occurred');
                        return;
                    }

                    if (data.status === 'success' && data.data) {
                        // Extract year from student ID (first 4 digits)
                        const year = id.substring(0, 4);
                        
                        setResult({
                            id: data.data.id || id,
                            specialization: data.data.specialization || 'N/A',
                            gpa: data.data.gpa || 'N/A',
                            credit_hours: data.data.credit_hours || 'N/A',
                            rank: data.data.rank || 'N/A',
                            error: data.data.error || null,
                            year: year
                        });
                    } else {
                        setError('Student ID not found');
                    }

                } catch (err) {
                    console.error('Error:', err);
                    setError(`Failed to fetch data: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = (e) => {
                e.preventDefault();
                const trimmedId = studentId.trim();
                
                if (!trimmedId) {
                    setError('Please enter a student ID');
                    return;
                }

                if (!/^\d{8}$/.test(trimmedId)) {
                    setError('Student ID must be 8 digits');
                    return;
                }

                fetchStudentData(trimmedId);
            };

            const getRankColor = (rank) => {
                if (rank === 'N/A' || !rank) return 'text-gray-500';
                const numRank = parseInt(rank);
                if (numRank === 1) return 'text-yellow-500';
                if (numRank <= 10) return 'text-blue-500';
                if (numRank <= 50) return 'text-green-500';
                return 'text-gray-600';
            };

            const getRankBadge = (rank) => {
                if (rank === 'N/A' || !rank) return null;
                const numRank = parseInt(rank);
                if (numRank === 1) return '🥇 Top Student!';
                if (numRank <= 10) return '🏆 Top 10';
                if (numRank <= 50) return '⭐ Top 50';
                return null;
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6">
                    <div className="max-w-2xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center mb-4">
                                <i data-lucide="award" className="w-12 h-12 text-indigo-600"></i>
                            </div>
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">
                                Student Rank Lookup
                            </h1>
                            <p className="text-gray-600">
                                Enter your student ID to view your rank with 90% Accuracy
                            </p>
                        </div>

                        {/* Rate Limit Info */}
                        {rateLimitInfo && (
                            <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6 flex items-start">
                                <i data-lucide="clock" className="w-5 h-5 text-yellow-500 mt-0.5 mr-3 flex-shrink-0"></i>
                                <div>
                                    <h3 className="font-semibold text-yellow-800">Rate Limit Reached</h3>
                                    <p className="text-yellow-700 text-sm">{rateLimitInfo}</p>
                                    <p className="text-yellow-600 text-xs mt-1">
                                        This helps protect student data from automated scraping.
                                    </p>
                                </div>
                            </div>
                        )}

                        {/* Search Form */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label htmlFor="studentId" className="block text-sm font-medium text-gray-700 mb-2">
                                        Student ID
                                    </label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            id="studentId"
                                            value={studentId}
                                            onChange={(e) => setStudentId(e.target.value)}
                                            placeholder="e.g., 20250001"
                                            maxLength={8}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
                                        />
                                        <i data-lucide="search" className="absolute right-3 top-3.5 w-5 h-5 text-gray-400"></i>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-1">
                                        Enter your 8-digit student ID (e.g., 2022XXXX, 2023XXXX, etc.)
                                    </p>
                                    
                                </div>

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center"
                                >
                                    {loading ? (
                                        <>
                                            <i data-lucide="loader-2" className="w-5 h-5 mr-2 animate-spin"></i>
                                            Searching...
                                        </>
                                    ) : (
                                        <>
                                            <i data-lucide="search" className="w-5 h-5 mr-2"></i>
                                            Search
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>

                        {/* Error Message */}
                        {error && !rateLimitInfo && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 flex items-start">
                                <i data-lucide="alert-circle" className="w-5 h-5 text-red-500 mt-0.5 mr-3 flex-shrink-0"></i>
                                <div>
                                    <h3 className="font-semibold text-red-800">Error</h3>
                                    <p className="text-red-700 text-sm">{error}</p>
                                </div>
                            </div>
                        )}

                        {/* Results */}
                        {result && (
                            <div className="bg-white rounded-lg shadow-lg p-6 space-y-6">
                                {/* Header */}
                                <div className="border-b pb-4">
                                    <div className="flex items-center justify-between">
                                        <div>
                                            <h2 className="text-2xl font-bold text-gray-800">
                                                ID: {result.id}
                                            </h2>
                                            <p className="text-sm text-gray-600">Year: {result.year}</p>
                                        </div>
                                        <div className="text-right">
                                            <span className="px-3 py-1 bg-indigo-100 text-indigo-700 rounded-full text-sm font-medium">
                                                {result.specialization || 'General'}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* Stats Grid */}
                                <div className="grid grid-cols-1 md:grid-cols-2 gap-4">
                                    {/* Rank */}
                                    <div className="bg-gradient-to-br from-yellow-50 to-yellow-100 rounded-lg p-4">
                                        <div className="flex items-center mb-2">
                                            <i data-lucide="award" className="w-5 h-5 text-yellow-600 mr-2"></i>
                                            <span className="text-sm font-medium text-gray-700">Rank</span>
                                        </div>
                                        <div className={`text-3xl font-bold ${getRankColor(result.rank)}`}>
                                            {result.rank === 'N/A' ? 'N/A' : `#${result.rank}`}
                                        </div>
                                        {getRankBadge(result.rank) && (
                                            <div className="mt-2 text-xs font-medium text-yellow-700">
                                                {getRankBadge(result.rank)}
                                            </div>
                                        )}
                                    </div>

                                    {/* GPA */}
                                    {/*<div className="bg-gradient-to-br from-blue-50 to-blue-100 rounded-lg p-4">
                                        <div className="flex items-center mb-2">
                                            <i data-lucide="book-open" className="w-5 h-5 text-blue-600 mr-2"></i>
                                            <span className="text-sm font-medium text-gray-700">GPA</span>
                                        </div>
                                        <div className="text-3xl font-bold text-blue-600">
                                            {result.gpa || 'N/A'}
                                        </div>
                                        <div className="mt-2 text-xs text-blue-700">
                                            {result.gpa && parseFloat(result.gpa) >= 3.4 ? 'Excellent, امتياز' : 
                                            result.gpa && parseFloat(result.gpa) >= 2.8 ? 'Very Good, جيد جدا' :
                                            result.gpa && parseFloat(result.gpa) >= 2.4 ? 'Good, جيد' :
                                            result.gpa && parseFloat(result.gpa) >= 2.0 ? 'Pass, ناجح' : 'Needs Improvement'}
                                        </div>
                                    </div>*/}

                                    {/* Credit Hours */}
                                    <div className="bg-gradient-to-br from-green-50 to-green-100 rounded-lg p-4">
                                        <div className="flex items-center mb-2">
                                            <i data-lucide="book-open" className="w-5 h-5 text-green-600 mr-2"></i>
                                            <span className="text-sm font-medium text-gray-700">Credit Hours</span>
                                        </div>
                                        <div className="text-3xl font-bold text-green-600">
                                            {result.credit_hours || 'N/A'}
                                        </div>
                                        <div className="mt-2 text-xs text-green-700">
                                            Completed
                                        </div>
                                    </div>
                                </div>

                                {/* Error Info */}
                                {result.error && (
                                    <div className="bg-orange-50 border border-orange-200 rounded-lg p-3">
                                        <p className="text-sm text-orange-700">
                                            <strong>Note:</strong> {result.error}
                                        </p>
                                    </div>
                                )}

                                {/* Success Message */}
                                {!result.error && (
                                    <div className="bg-green-50 border border-green-200 rounded-lg p-3">
                                        <p className="text-sm text-green-700 text-center">
                                            ✓ Your academic record has been successfully retrieved
                                        </p>
                                    </div>
                                )}
                            </div>
                        )}

                        {/* Footer */}
                        <div className="mt-8 text-center text-sm text-gray-600">
                            <p>Faculty of Computers and Artificial Intelligence</p>
                            <p className="mt-1">Student Academic Records System</p>
                        </div>
                    </div>
                </div>
            );
        }

        // Render the app
        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentRankLookup />);
    </script>
</body>
</html>
