<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>FCAIH - Student Lookup</title>

    <script src="https://www.google.com/recaptcha/api.js?render=6Lebi6EsAAAAAKnCbQW14dj-LngpAzKonC79fIUh"></script>
    
    <link rel="icon" type="image/png" href="CapitalUniversity.png">
    
    <script src="https://cdn.tailwindcss.com"></script>
    
    <script crossorigin src="https://unpkg.com/react@18/umd/react.production.min.js"></script>
    <script crossorigin src="https://unpkg.com/react-dom@18/umd/react-dom.production.min.js"></script>
    
    <script src="https://unpkg.com/@babel/standalone/babel.min.js"></script>
    
    <script src="https://unpkg.com/lucide@latest"></script>
    
    <style>
        body {
            margin: 0;
            padding: 0;
            font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', 'Roboto', 'Oxygen',
                'Ubuntu', 'Cantarell', 'Fira Sans', 'Droid Sans', 'Helvetica Neue',
                sans-serif;
            -webkit-font-smoothing: antialiased;
            -moz-osx-font-smoothing: grayscale;
        }
        
        .rtl-text {
            direction: rtl;
            text-align: right;
        }
        
        @keyframes slideIn {
            from { opacity: 0; transform: translateY(-10px); }
            to { opacity: 1; transform: translateY(0); }
        }
        
        .animate-slide-in {
            animation: slideIn 0.3s ease-out;
        }
    </style>
</head>
<body>
    <div id="root"></div>

    <script type="text/babel">
        const { useState, useEffect } = React;

        const APPS_SCRIPT_URL = 'https://script.google.com/macros/s/AKfycbzLgXuvPOS_r82N9M8FqZ1TkoZ8Pl9p7E5MxKwRT876ltNvs2sx_2uiTH3getkoB3i-/exec';

        function StudentRankLookup() {
            const [studentId, setStudentId] = useState('');
            const [loading, setLoading] = useState(false);
            const [result, setResult] = useState(null);
            const [error, setError] = useState(null);
            const [rateLimitInfo, setRateLimitInfo] = useState(null);

            // Initialize lucide icons whenever the UI updates
            useEffect(() => {
                if (window.lucide) {
                    window.lucide.createIcons();
                }
            }, [result, error, loading, rateLimitInfo]);

            const getBrowserFingerprint = () => {
                let token = localStorage.getItem('fcaih_user_token');
                if (!token) {
                    token = 'user_' + Math.random().toString(36).substr(2, 9) + Date.now().toString(36);
                    localStorage.setItem('fcaih_user_token', token);
                }
                return token;
            };

            const isArabicText = (text) => {
                if (!text || typeof text !== 'string') return false;
                const arabicChars = (text.match(/[\u0600-\u06FF]/g) || []).length;
                const latinChars = (text.match(/[a-zA-Z]/g) || []).length;
                return arabicChars > latinChars;
            };

            const fetchStudentData = async (id) => {
                setLoading(true);
                setError(null);
                setResult(null);
                setRateLimitInfo(null);

                try {
                    const userToken = getBrowserFingerprint();
                    const response = await fetch(`${APPS_SCRIPT_URL}?id=${encodeURIComponent(id)}&userToken=${userToken}`);
                    
                    if (!response.ok) {
                        throw new Error('Network response was not ok');
                    }

                    const data = await response.json();

                    if (data.status === 'error') {
                        if (data.message && data.message.includes('Too many requests')) {
                            setRateLimitInfo(data.message);
                        }
                        setError(data.message || 'An error occurred');
                        return;
                    }

                    if (data.status === 'success' && data.data) {
                        const safeString = (val) => (val === null || val === undefined) ? 'N/A' : String(val);

                        setResult({
                            id: safeString(data.data.id || id),
                            name: safeString(data.data.name),
                            specialization: safeString(data.data.specialization || 'General'),
                            credit_hours: safeString(data.data.credit_hours),
                            overall_rank: safeString(data.data.overall_rank),
                            spec_rank: safeString(data.data.spec_rank),
                            error: data.data.error || null,
                            year: String(id).substring(0, 4)
                        });
                    } else {
                        setError('Student ID not found');
                    }

                } catch (err) {
                    console.error('Error:', err);
                    setError(`Failed to fetch data: ${err.message}`);
                } finally {
                    setLoading(false);
                }
            };

            const handleSubmit = (e) => {

                window.grecaptcha.ready(function() {
                    window.grecaptcha.execute('YOUR_SITE_KEY', {action: 'submit'}).then(async function(token) {
                        // Send this token to your Apps Script instead of the fake browser token
                        const response = await fetch(`${APPS_SCRIPT_URL}?id=${studentId}&recaptchaToken=${token}`);
                    });
                });
                e.preventDefault();
                const trimmedId = studentId.trim();
                
                if (!trimmedId) {
                    setError('Please enter a student ID');
                    return;
                }
                if (!/^\d{8}$/.test(trimmedId)) {
                    setError('Student ID must be 8 digits');
                    return;
                }
                fetchStudentData(trimmedId);
            };

            const getRankColor = (rank) => {
                if (!rank || rank === 'N/A' || rank.includes('N/A')) return 'text-gray-500';
                
                const match = rank.match(/^(\d+)\/(\d+)$/);
                if (!match) return 'text-gray-600';
                
                const numRank = parseInt(match[1]);
                const total = parseInt(match[2]);
                const percentile = (numRank / total) * 100;
                
                if (numRank === 1) return 'text-yellow-500';
                if (percentile <= 1.5) return 'text-yellow-600';
                if (percentile <= 5) return 'text-blue-500';
                if (percentile <= 10) return 'text-green-500';
                return 'text-gray-600';
            };

            const getRankBadge = (rank) => {
                if (!rank || rank === 'N/A' || rank.includes('N/A')) return null;
                
                const match = rank.match(/^(\d+)\/(\d+)$/);
                if (!match) return null;
                
                const numRank = parseInt(match[1]);
                const total = parseInt(match[2]);
                const percentile = (numRank / total) * 100;
                
                if (numRank === 1) return '🥇 Top Student!';
                if (percentile <= 1.5) return '🏆 Top 1.5%';
                if (percentile <= 5) return '⭐ Top 5%';
                if (percentile <= 10) return '✨ Top 10%';
                if (percentile <= 25) return '📈 Top 25%';
                return null;
            };

            const getSpecBadge = (rank) => {
                if (!rank || rank === 'N/A' || rank.includes('N/A')) return null;
                
                const match = rank.match(/^(\d+)\/(\d+)$/);
                if (!match) return null;
                
                const numRank = parseInt(match[1]);
                
                if (numRank === 1) return '👑 Top in Specialization';
                if (numRank <= 3) return '🌟 Top 3 in Specialization';
                if (numRank <= 5) return '⚡ Top 5 in Specialization';
                return null;
            };

            const hasValidName = (name) => {
                return name && name !== 'N/A' && name !== 'null' && name !== 'undefined';
            };

            return (
                <div className="min-h-screen bg-gradient-to-br from-blue-50 to-indigo-100 p-6">
                    <div className="max-w-3xl mx-auto">
                        {/* Header */}
                        <div className="text-center mb-8">
                            <div className="flex items-center justify-center mb-4">
                                <i data-lucide="award" className="w-12 h-12 text-indigo-600"></i>
                            </div>
                            <h1 className="text-4xl font-bold text-gray-800 mb-2">
                                Student Rank Lookup
                            </h1>
                            <p className="text-gray-600">
                                Enter your student ID to view your academic standing With 90% Accuracy
                            </p>
                        </div>

                        {/* Rate Limit Info */}
                        {rateLimitInfo && (
                            <div className="bg-yellow-50 border border-yellow-200 rounded-lg p-4 mb-6 flex items-start animate-slide-in">
                                <i data-lucide="clock" className="w-5 h-5 text-yellow-500 mt-0.5 mr-3 flex-shrink-0"></i>
                                <div>
                                    <h3 className="font-semibold text-yellow-800">Rate Limit Reached</h3>
                                    <p className="text-yellow-700 text-sm">{rateLimitInfo}</p>
                                </div>
                            </div>
                        )}

                        {/* Search Form */}
                        <div className="bg-white rounded-lg shadow-lg p-6 mb-6">
                            <form onSubmit={handleSubmit} className="space-y-4">
                                <div>
                                    <label htmlFor="studentId" className="block text-sm font-medium text-gray-700 mb-2">
                                        Student ID
                                    </label>
                                    <div className="relative">
                                        <input
                                            type="text"
                                            id="studentId"
                                            value={studentId}
                                            onChange={(e) => setStudentId(e.target.value)}
                                            placeholder="e.g., 20250001"
                                            maxLength={8}
                                            className="w-full px-4 py-3 border border-gray-300 rounded-lg focus:ring-2 focus:ring-indigo-500 focus:border-transparent outline-none"
                                        />
                                        <i data-lucide="search" className="absolute right-3 top-3.5 w-5 h-5 text-gray-400"></i>
                                    </div>
                                    <p className="text-xs text-gray-500 mt-1">
                                        Enter your 8-digit student ID
                                    </p>
                                </div>

                                <button
                                    type="submit"
                                    disabled={loading}
                                    className="w-full bg-indigo-600 hover:bg-indigo-700 disabled:bg-gray-400 text-white font-semibold py-3 px-6 rounded-lg transition-colors flex items-center justify-center"
                                >
                                    {loading ? (
                                        <>
                                            <i data-lucide="loader-2" className="w-5 h-5 mr-2 animate-spin"></i>
                                            Searching...
                                        </>
                                    ) : (
                                        <>
                                            <i data-lucide="search" className="w-5 h-5 mr-2"></i>
                                            Search
                                        </>
                                    )}
                                </button>
                            </form>
                        </div>

                        {/* Error Message */}
                        {error && !rateLimitInfo && (
                            <div className="bg-red-50 border border-red-200 rounded-lg p-4 mb-6 flex items-start animate-slide-in">
                                <i data-lucide="alert-circle" className="w-5 h-5 text-red-500 mt-0.5 mr-3 flex-shrink-0"></i>
                                <div>
                                    <h3 className="font-semibold text-red-800">Error</h3>
                                    <p className="text-red-700 text-sm">{error}</p>
                                </div>
                            </div>
                        )}

                        {/* Results */}
                        {result && (
                            <div className="bg-white rounded-lg shadow-lg overflow-hidden animate-slide-in">
                                {/* Student Info Header */}
                                <div className="bg-gradient-to-r from-indigo-600 to-blue-600 text-white p-6">
                                    <div className="flex flex-col md:flex-row md:items-start justify-between gap-4">
                                        <div className="flex-1">
                                            <div className="flex items-center mb-2">
                                                <i data-lucide="user" className="w-5 h-5 mr-2"></i>
                                                <span className="text-sm font-medium opacity-90">
                                                    {hasValidName(result.name) ? 'Student Name' : 'Student ID'}
                                                </span>
                                            </div>
                                            
                                            <h2 className={`text-2xl md:text-3xl font-bold mb-3 ${hasValidName(result.name) && isArabicText(result.name) ? 'rtl-text' : ''}`}>
                                                {hasValidName(result.name) ? result.name : result.id}
                                            </h2>

                                            <div className="flex items-center space-x-3 text-sm">
                                                {hasValidName(result.name) && (
                                                    <span className="flex items-center">
                                                        <i data-lucide="hash" className="w-4 h-4 mr-1"></i>
                                                        {result.id}
                                                    </span>
                                                )}
                                                <span className="flex items-center">
                                                    <i data-lucide="calendar" className="w-4 h-4 mr-1"></i>
                                                    Class of {result.year}
                                                </span>
                                            </div>
                                        </div>
                                        
                                        <div className="md:ml-4 self-start">
                                            <span className="inline-block px-5 py-2.5 bg-white/25 backdrop-blur-sm border border-white/20 rounded-xl text-lg font-bold shadow-sm whitespace-nowrap">
                                                {result.specialization}
                                            </span>
                                        </div>
                                    </div>
                                </div>

                                {/* Rank Badges */}
                                {(getRankBadge(result.overall_rank) || getSpecBadge(result.spec_rank)) && (
                                    <div className="bg-gradient-to-r from-yellow-50 to-orange-50 px-6 py-4 border-b border-gray-200">
                                        <div className="flex flex-wrap gap-2">
                                            {getRankBadge(result.overall_rank) && (
                                                <span className="px-3 py-1.5 bg-yellow-100 text-yellow-800 rounded-full text-sm font-semibold">
                                                    {getRankBadge(result.overall_rank)}
                                                </span>
                                            )}
                                            {getSpecBadge(result.spec_rank) && (
                                                <span className="px-3 py-1.5 bg-blue-100 text-blue-800 rounded-full text-sm font-semibold">
                                                    {getSpecBadge(result.spec_rank)}
                                                </span>
                                            )}
                                        </div>
                                    </div>
                                )}

                                {/* Stats Grid */}
                                <div className="p-6 space-y-6">
                                    <div className="grid grid-cols-1 md:grid-cols-2 gap-6">
                                        
                                        {/* Specialization Rank (GIANT BOX) */}
                                        <div className="bg-gradient-to-br from-blue-50 to-indigo-100 rounded-2xl p-8 border-2 border-blue-200 md:col-span-2 shadow-sm text-center relative overflow-hidden">
                                            <div className="relative z-10 flex flex-col items-center justify-center">
                                                <div className="flex items-center mb-4">
                                                    <i data-lucide="award" className="w-8 h-8 text-blue-600 mr-3"></i>
                                                    <span className="text-xl font-bold text-gray-800 uppercase tracking-wide">Specialization Rank</span>
                                                </div>
                                                <div className={`text-6xl md:text-7xl font-black mb-3 tracking-tight ${getRankColor(result.spec_rank)}`}>
                                                    {result.spec_rank}
                                                </div>
                                                {result.spec_rank !== 'N/A' && (
                                                    <div className="inline-block px-4 py-1 rounded-full bg-blue-100/50 text-sm text-blue-800 font-medium">
                                                        Among {result.specialization} students
                                                    </div>
                                                )}
                                            </div>
                                            {/* Background Decoration */}
                                            <div className="absolute top-0 right-0 p-4 opacity-5 pointer-events-none">
                                                <i data-lucide="award" className="w-48 h-48 text-blue-900"></i>
                                            </div>
                                        </div>

                                        {/* Overall Rank (With Icon Background) */}
                                        <div className="bg-gradient-to-br from-yellow-50 to-orange-50 rounded-xl p-6 border border-yellow-200 relative overflow-hidden">
                                            <div className="relative z-10">
                                                <div className="flex items-center mb-3">
                                                    <i data-lucide="trophy" className="w-5 h-5 text-yellow-600 mr-2"></i>
                                                    <span className="text-sm font-semibold text-gray-700">Overall Rank</span>
                                                </div>
                                                <div className={`text-4xl font-bold mb-2 ${getRankColor(result.overall_rank)}`}>
                                                    {result.overall_rank}
                                                </div>
                                                {result.overall_rank !== 'N/A' && (
                                                    <div className="text-xs text-gray-600">
                                                        Out of all students in your year
                                                    </div>
                                                )}
                                            </div>
                                            {/* Background Decoration */}
                                            <div className="absolute -bottom-4 -right-4 opacity-10 pointer-events-none">
                                                <i data-lucide="trophy" className="w-32 h-32 text-yellow-700"></i>
                                            </div>
                                        </div>

                                        {/* Credit Hours (With Icon Background) */}
                                        <div className="bg-gradient-to-br from-green-50 to-emerald-50 rounded-xl p-6 border border-green-200 relative overflow-hidden">
                                            <div className="relative z-10">
                                                <div className="flex items-center mb-3">
                                                    <i data-lucide="book-open" className="w-5 h-5 text-green-600 mr-2"></i>
                                                    <span className="text-sm font-semibold text-gray-700">Credit Hours</span>
                                                </div>
                                                <div className="text-4xl font-bold text-green-600 mb-2">
                                                    {result.credit_hours}
                                                </div>
                                                <div className="text-xs text-gray-600">
                                                    Successfully completed
                                                </div>
                                            </div>
                                            {/* Background Decoration */}
                                            <div className="absolute -bottom-4 -right-4 opacity-10 pointer-events-none">
                                                <i data-lucide="book-open" className="w-32 h-32 text-green-800"></i>
                                            </div>
                                        </div>

                                    </div>

                                    {/* Success Footer */}
                                    {!result.error && (
                                        <div className="mt-4 bg-green-50 border border-green-200 rounded-lg p-4">
                                            <div className="flex items-center justify-center">
                                                <i data-lucide="check-circle" className="w-5 h-5 text-green-600 mr-2"></i>
                                                <p className="text-sm text-green-700 font-medium">
                                                    Academic record successfully retrieved
                                                </p>
                                            </div>
                                        </div>
                                    )}
                                </div>
                            </div>
                        )}

                        <div className="mt-8 text-center text-sm text-gray-600">
                            <p className="font-medium">Faculty of Computers and Artificial Intelligence</p>
                            <p className="mt-1">Student Academic Records System</p>
                        </div>
                    </div>
                </div>
            );
        }

        const root = ReactDOM.createRoot(document.getElementById('root'));
        root.render(<StudentRankLookup />);
    </script>
</body>

</html>
